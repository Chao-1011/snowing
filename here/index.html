<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>here</title>
  <link rel="stylesheet" href="./minimal.css">
  <script src="./snow-message.js" defer></script>
  <script src="./decode.js" defer></script>
</head>
<body>
  <main>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <button class="picker" id="picker" type="button" aria-label="放入图片">
      <svg id="pick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <img id="preview" alt="" hidden>
    </button>
    <div class="controls">
      <button class="icon" id="decode" type="button" aria-label="解码" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5M4 15v5h5M8 10h8m-8 4h6"/></svg>
      </button>
    </div>
    <p id="result" role="status"></p>
  </main>
</body>
</html>
